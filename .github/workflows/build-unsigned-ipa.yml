
name: Build unsigned HEV Socks5 IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode targets and bundled framework
        run: |
          xcodebuild -version
          xcodebuild -list -project Socks5.xcodeproj
          test -f HevSocks5Server.xcframework/Info.plist || {
            echo "ERROR: Missing HevSocks5Server.xcframework in the fork"
            exit 1
          }

      - name: Build without code signing
        run: |
          xcodebuild \
            -project Socks5.xcodeproj \
            -target Socks5 \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -e
          echo "Searching for compiled iPhone app..."
          APP_PATH=$(find "$PWD/build" -type d -name "Socks5.app" -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No compiled Socks5.app found"
            find "$PWD/build" -maxdepth 5 -type d
            exit 1
          fi

          echo "Found app: $APP_PATH"
          mkdir -p "$PWD/Payload"
          cp -R "$APP_PATH" "$PWD/Payload/"
          zip -r Socks5-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Socks5-unsigned
          path: Socks5-unsigned.ipa
          if-no-files-found: error
